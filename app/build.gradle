
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.towerwarbot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.towerwarbot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-shizuku'
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
